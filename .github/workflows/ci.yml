name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (build, tests unitaires et d'intégration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build et tests (Testcontainers PostgreSQL)
        run: mvn -B -ntp verify 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Signaler les erreurs
        if: failure()
        run: |
          grep -E "^\[ERROR\]" build.log | grep -vE "^\[ERROR\] *$|Re-run Maven|-> \[Help|To see the full stack|^\[ERROR\] \[Help" \
            | head -40 | sed 's/^/::error::/' || true
          for f in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
            [ -f "$f" ] && grep -A3 -E "FAILURE|ERROR" "$f" | head -20 | sed 's/^/::warning::/' || true
          done
      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: Front-end (lint, tests unitaires, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - id: presence
        working-directory: .
        run: echo "exists=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        if: steps.presence.outputs.exists == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.presence.outputs.exists == 'true'
        run: npm ci
      - if: steps.presence.outputs.exists == 'true'
        run: npm run lint
      - if: steps.presence.outputs.exists == 'true'
        run: npm run test:ci
      - if: steps.presence.outputs.exists == 'true'
        run: npm run build

  e2e:
    name: Bout en bout (Docker Compose + Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - id: presence
        run: echo "exists=$([ -f frontend/playwright.config.ts ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Démarrer l'application avec les données de démonstration
        if: steps.presence.outputs.exists == 'true'
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health | grep -q UP && curl -sf http://localhost:4200 > /dev/null && exit 0
            sleep 5
          done
          docker compose ps -a
          echo "::error::L'application n'a pas démarré : extrait des journaux ci-dessous"
          docker compose ps -a --format '{{.Service}} {{.State}} {{.Status}}' | sed 's/^/::error::/'
          docker compose logs --no-color --tail=400 | grep -E "ERROR|Exception|Caused by|emerg|FATAL|APPLICATION FAILED|Description:|Reason:" \
            | head -25 | sed 's/^/::error::/'
          exit 1
      - uses: actions/setup-node@v5
        if: steps.presence.outputs.exists == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer Playwright
        if: steps.presence.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Tests de bout en bout
        if: steps.presence.outputs.exists == 'true'
        working-directory: frontend
        run: npm run e2e
      - name: Journaux en cas d'échec
        if: failure() && steps.presence.outputs.exists == 'true'
        run: docker compose logs --tail=150
      - uses: actions/upload-artifact@v4
        if: failure() && steps.presence.outputs.exists == 'true'
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
