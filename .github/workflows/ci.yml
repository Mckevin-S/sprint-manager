name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (build, tests unitaires et d'intégration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build et tests (Testcontainers PostgreSQL)
        run: mvn -B -ntp verify 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Signaler les erreurs
        if: failure()
        run: |
          grep -E "^\[ERROR\]" build.log | grep -vE "^\[ERROR\] *$|Re-run Maven|-> \[Help|To see the full stack|^\[ERROR\] \[Help" \
            | head -40 | sed 's/^/::error::/' || true
          for f in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
            [ -f "$f" ] && grep -A3 -E "FAILURE|ERROR" "$f" | head -20 | sed 's/^/::warning::/' || true
          done
      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: Front-end (lint, tests unitaires, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - id: presence
        working-directory: .
        run: echo "exists=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.presence.outputs.exists == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.presence.outputs.exists == 'true'
        run: npm ci
      - if: steps.presence.outputs.exists == 'true'
        run: npm run lint
      - if: steps.presence.outputs.exists == 'true'
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - if: steps.presence.outputs.exists == 'true'
        run: npm run build
