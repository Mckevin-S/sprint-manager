spring:
  application:
    name: sprint-manager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sprint}
    username: ${DB_USERNAME:sprint}
    password: ${DB_PASSWORD:sprint}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

app:
  jwt:
    # Au moins 32 caractères. À remplacer en production via JWT_SECRET.
    secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
    validity: ${JWT_VALIDITY:PT8H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  demo:
    enabled: ${DEMO_DATA:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
